{% extends "auth_base.html" %}
{% block title %}Verify Code{% endblock %}

{% block form_content %}
<p class="form-title" style="margin-top:10px;">Enter Verification Code</p>
<p style="text-align:center;font-size:0.74rem;color:#6b7280;margin-bottom:18px;">Check your email <strong>{{ email }}</strong> for the 6-digit code.</p>

<form action="/activate/verify" method="POST">
    <input type="hidden" name="email" value="{{ email }}">
    <div class="field">
        <label for="code">6-Digit Code</label>
        <input type="text" name="code" id="code" required maxlength="6" placeholder="123456"
               style="width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:1.1rem;font-weight:700;letter-spacing:0.25em;text-align:center;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;">
    </div>
    <button type="submit" class="btn-signin" style="margin-top:6px;">Verify Code</button>
</form>

<a href="/activate" style="display:block;text-align:center;font-size:0.74rem;color:#6b7280;margin-top:14px;text-decoration:none;">← Back</a>
{% endblock %}
