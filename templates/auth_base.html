<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWU Portal — {% block title %}{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── Animated Campus Background ── */
        .bg-campus {
            position: fixed;
            inset: 0;
            background-image: url('/static/ewu_campus_night.jpg');
            background-size: cover;
            background-position: center bottom;
            z-index: 0;
            animation: bgDrift 25s ease-in-out infinite alternate;
        }
        @keyframes bgDrift {
            0%   { transform: scale(1.04) translateX(0); }
            100% { transform: scale(1.07) translateX(-10px); }
        }

        /* Soft overlay */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(170deg,
                rgba(20,10,50,0.35) 0%,
                rgba(10,5,30,0.45) 100%
            );
            z-index: 1;
        }

        /* Stars */
        .stars-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: white;
            animation: twinkle var(--d,3s) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            from { opacity: 0.15; transform: scale(0.8); }
            to   { opacity: 0.85; transform: scale(1.2); }
        }

        /* ── Outer wrapper: logo + card stacked ── */
        .auth-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 0 16px;
            animation: cardIn 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── Floating Logo ── */
        .logo-float {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.28);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: -20px; /* overlaps card top */
            z-index: 2;
            position: relative;
        }
        .logo-float img {
            width: 74px;
            height: 74px;
            object-fit: contain;
        }

        /* ── Card ── */
        .auth-card {
            width: 100%;
            background: rgba(255,255,255,0.97);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.5);
            padding: 32px 28px 28px;
            position: relative;
            z-index: 1;
        }

        /* Instructions */
        .instructions {
            font-size: 0.72rem;
            font-weight: 500;
            color: #1d4ed8;
            text-align: center;
            line-height: 1.7;
            padding-top: 8px;
            margin-bottom: 14px;
        }
        .instructions a { color: #dc2626; font-weight: 700; text-decoration: none; }
        .instructions a:hover { text-decoration: underline; }

        /* Page title */
        .form-title {
            text-align: center;
            font-size: 0.82rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Field */
        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 5px;
        }
        .field-inner { position: relative; }
        .field input[type="text"],
        .field input[type="email"],
        .field input[type="password"] {
            width: 100%;
            padding: 9px 38px 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            color: #111827;
            background: white;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus {
            border-color: #6b7280;
            box-shadow: 0 0 0 3px rgba(107,114,128,0.12);
        }
        .field input::placeholder { color: #9ca3af; font-size: 0.8rem; }

        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            display: flex;
            align-items: center;
            padding: 2px;
        }
        .eye-btn:hover { color: #6b7280; }

        /* Captcha row */
        .captcha-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
        }
        .captcha-expr {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1f2937;
            white-space: nowrap;
        }
        .captcha-ans {
            width: 52px;
            padding: 6px 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            color: #111827;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .captcha-ans:focus { border-color: #6b7280; }
        .captcha-refresh {
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            display: flex;
            align-items: center;
            padding: 2px;
            margin-left: auto;
        }
        .captcha-refresh:hover { color: #6b7280; }
        .captcha-err {
            font-size: 0.68rem;
            color: #ef4444;
            font-weight: 600;
            margin-bottom: 8px;
            display: none;
        }

        /* Remember me row */
        .remember-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }
        .remember-row input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: #374151;
            cursor: pointer;
        }
        .remember-row label {
            font-size: 0.78rem;
            color: #374151;
            cursor: pointer;
            user-select: none;
        }

        /* Sign In button — teal */
        .btn-signin {
            width: 100%;
            padding: 11px;
            background: #0d9488;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.04em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
            box-shadow: 0 3px 12px rgba(13,148,136,0.3);
        }
        .btn-signin:hover { background: #0f766e; }
        .btn-signin:active { transform: scale(0.99); }

        /* OR divider */
        .or-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 12px 0;
            font-size: 0.72rem;
            font-weight: 600;
            color: #9ca3af;
        }
        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }

        /* Google button */
        .btn-google {
            width: 100%;
            padding: 10px;
            background: white;
            border: 1.5px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-google:hover { background: #f9fafb; border-color: #9ca3af; }

        /* Forgot password */
        .forgot-link {
            display: block;
            text-align: center;
            font-size: 0.74rem;
            font-weight: 500;
            color: #2563eb;
            margin-top: 10px;
            text-decoration: none;
        }
        .forgot-link:hover { text-decoration: underline; }
        .forgot-link span { font-weight: 700; }

        /* Extra buttons row below card */
        .extra-btns {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-activate {
            width: 100%;
            padding: 11px;
            background: #dc2626;
            color: white;
            font-weight: 700;
            font-size: 0.82rem;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
            box-shadow: 0 3px 10px rgba(220,38,38,0.22);
        }
        .btn-activate:hover { background: #b91c1c; }

        .btn-admin {
            width: 100%;
            padding: 11px;
            background: #0d9488;
            color: white;
            font-weight: 700;
            font-size: 0.82rem;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
            box-shadow: 0 3px 10px rgba(13,148,136,0.22);
        }
        .btn-admin:hover { background: #0f766e; }

        /* Toast */
        #auth-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 200;
            min-width: 290px;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.18);
            transform: translateY(16px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            display: none;
        }
        #auth-toast.show { display: block; transform: translateY(0); opacity: 1; }
        #auth-toast.error   { background:#fef2f2; border-left:4px solid #ef4444; }
        #auth-toast.success { background:#f0fdf4; border-left:4px solid #22c55e; }
        #auth-toast.info    { background:#eff6ff; border-left:4px solid #3b82f6; }
        .toast-inner { padding:13px 15px; display:flex; align-items:flex-start; gap:9px; }
        .toast-lbl   { font-weight:700; font-size:0.78rem; }
        .toast-sub   { font-size:0.7rem; margin-top:2px; }
        .error  .toast-lbl, .error  .toast-sub  { color:#b91c1c; }
        .success .toast-lbl, .success .toast-sub { color:#15803d; }
        .info   .toast-lbl, .info   .toast-sub   { color:#1d4ed8; }
    </style>
</head>
<body>
    <!-- Background -->
    <div class="bg-campus"></div>
    <div class="bg-overlay"></div>
    <div class="stars-layer" id="starsLayer"></div>

    <!-- Auth Wrapper -->
    <div class="auth-wrapper">
        <!-- Floating EWU Logo -->
        <div class="logo-float">
            <!-- EWU Logo SVG -->
            <svg viewBox="0 0 80 80" width="74" height="74" xmlns="http://www.w3.org/2000/svg">
                <rect width="80" height="80" rx="14" fill="#1a3fa0"/>
                <!-- Building silhouette -->
                <rect x="8"  y="34" width="14" height="28" rx="1" fill="#ffffff" opacity="0.15"/>
                <rect x="10" y="30" width="10" height="4" rx="1" fill="#ffffff" opacity="0.2"/>
                <rect x="10" y="38" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.9"/>
                <rect x="15" y="38" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.9"/>
                <rect x="10" y="44" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.7"/>
                <rect x="15" y="44" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.7"/>
                <rect x="58" y="34" width="14" height="28" rx="1" fill="#ffffff" opacity="0.15"/>
                <rect x="60" y="30" width="10" height="4" rx="1" fill="#ffffff" opacity="0.2"/>
                <rect x="60" y="38" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.9"/>
                <rect x="65" y="38" width="3" height="4" rx="0.5" fill="#f59e0b" opacity="0.9"/>
                <!-- Text -->
                <text x="40" y="24" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">EAST</text>
                <text x="40" y="36" font-family="Arial Black, sans-serif" font-size="13" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="0.5">WEST</text>
                <line x1="12" y1="43" x2="68" y2="43" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
                <text x="40" y="56" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.85)" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">UNIVERSITY</text>
            </svg>
        </div>

        <!-- Card -->
        <div class="auth-card">
            {% block form_content %}{% endblock %}
        </div>

        <!-- Below-card buttons -->
        {% block extra_buttons %}{% endblock %}
    </div>

    <!-- Toast -->
    <div id="auth-toast">
        <div class="toast-inner">
            <i id="t-icon" data-lucide="info" style="width:16px;height:16px;flex-shrink:0;margin-top:1px;"></i>
            <div>
                <p class="toast-lbl" id="t-title">Notice</p>
                <p class="toast-sub" id="t-msg"></p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Stars
        const sl = document.getElementById('starsLayer');
        for (let i = 0; i < 70; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            const sz = (Math.random() * 2.2 + 0.5).toFixed(1);
            s.style.cssText = `width:${sz}px;height:${sz}px;top:${(Math.random()*70).toFixed(1)}%;left:${(Math.random()*100).toFixed(1)}%;--d:${(Math.random()*3+2).toFixed(1)}s;animation-delay:${(Math.random()*3).toFixed(1)}s;`;
            sl.appendChild(s);
        }

        // Toast
        function showAuthToast(type, title, msg) {
            const t = document.getElementById('auth-toast');
            t.className = `show ${type}`;
            document.getElementById('t-title').textContent = title;
            document.getElementById('t-msg').textContent = msg;
            document.getElementById('t-icon').setAttribute('data-lucide',
                type === 'error' ? 'x-circle' : type === 'success' ? 'check-circle' : 'info');
            lucide.createIcons();
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => { t.style.display = 'none'; }, 300);
            }, 5500);
        }

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        window.addEventListener('DOMContentLoaded', function () {
            {% for category, message in messages %}
            showAuthToast('{{ "success" if category == "success" else "error" }}',
                '{{ "Success" if category == "success" else "Notice" }}',
                {{ message | tojson }});
            {% endfor %}
        });
        {% endif %}
        {% endwith %}
    </script>
</body>
</html>
