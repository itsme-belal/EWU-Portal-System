{% extends "auth_base.html" %}
{% block title %}Set Password{% endblock %}

{% block form_content %}
<p class="form-title" style="margin-top:10px;">Set Your Password</p>
<p style="text-align:center;font-size:0.74rem;color:#6b7280;margin-bottom:18px;">Create a secure password for <strong>{{ email }}</strong></p>

<form action="/activate/complete" method="POST">
    <input type="hidden" name="email" value="{{ email }}">
    <div class="field">
        <label for="password">New Password</label>
        <div class="field-inner">
            <input type="password" name="password" id="password" required placeholder="Min. 4 characters" minlength="4">
        </div>
    </div>
    <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <div class="field-inner">
            <input type="password" name="confirm_password" id="confirm_password" required placeholder="Re-enter password" minlength="4">
        </div>
    </div>
    <button type="submit" class="btn-signin" style="margin-top:6px;">Complete Activation</button>
</form>
{% endblock %}
