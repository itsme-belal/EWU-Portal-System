{% extends "auth_base.html" %}
{% block title %}Set New Password{% endblock %}

{% block form_content %}

<!-- Icon + Title -->
<div style="text-align:center; margin: 8px 0 20px;">
    <div style="display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:#fef3c7;margin-bottom:12px;">
        <i data-lucide="lock-keyhole" style="width:24px;height:24px;color:#d97706;"></i>
    </div>
    <p class="form-title" style="margin:0 0 4px;">Create New Password</p>
    <p style="font-size:0.74rem;color:#6b7280;line-height:1.6;">
        Set a new secure password for<br>
        <strong style="color:#374151;">{{ email }}</strong>
    </p>
</div>

<form action="/forgot-password/complete" method="POST" onsubmit="return checkPwdMatch()">
    <input type="hidden" name="email" value="{{ email }}">

    <!-- New Password -->
    <div class="field">
        <label for="password">New Password</label>
        <div class="field-inner">
            <input type="password" name="password" id="password" required minlength="4"
                   placeholder="Min. 4 characters"
                   style="padding-left:12px;padding-right:38px;">
            <button type="button" class="eye-btn" onclick="toggleField('password','eye1')">
                <i data-lucide="eye" id="eye1" style="width:15px;height:15px;"></i>
            </button>
        </div>
    </div>

    <!-- Confirm Password -->
    <div class="field">
        <label for="confirm_password">Confirm Password</label>
        <div class="field-inner">
            <input type="password" name="confirm_password" id="confirm_password" required minlength="4"
                   placeholder="Re-enter password"
                   style="padding-left:12px;padding-right:38px;">
            <button type="button" class="eye-btn" onclick="toggleField('confirm_password','eye2')">
                <i data-lucide="eye" id="eye2" style="width:15px;height:15px;"></i>
            </button>
        </div>
        <p id="pwd-err" style="font-size:0.68rem;color:#ef4444;font-weight:600;margin-top:4px;display:none;">
            ✕ Passwords do not match.
        </p>
    </div>

    <!-- Password strength bar -->
    <div style="margin-bottom:14px;">
        <div style="height:4px;border-radius:4px;background:#e5e7eb;overflow:hidden;">
            <div id="strength-bar" style="height:100%;width:0%;transition:width 0.3s,background 0.3s;border-radius:4px;"></div>
        </div>
        <p id="strength-label" style="font-size:0.66rem;color:#9ca3af;margin-top:4px;text-align:right;"></p>
    </div>

    <button type="submit" class="btn-signin" style="background:linear-gradient(135deg,#d97706,#f59e0b);box-shadow:0 3px 12px rgba(217,119,6,0.3);">
        Save New Password
    </button>
</form>

<div style="display:flex;justify-content:center;margin-top:16px;padding-top:14px;border-top:1px solid #f1f5f9;">
    <a href="/login" style="font-size:0.74rem;color:#6b7280;text-decoration:none;display:flex;align-items:center;gap:4px;font-weight:500;">
        <i data-lucide="arrow-left" style="width:13px;height:13px;"></i> Back to Sign In
    </a>
</div>

<script>
    function toggleField(fieldId, iconId) {
        const inp = document.getElementById(fieldId);
        const ico = document.getElementById(iconId);
        inp.type = inp.type === 'password' ? 'text' : 'password';
        ico.setAttribute('data-lucide', inp.type === 'password' ? 'eye' : 'eye-off');
        lucide.createIcons();
    }

    function checkPwdMatch() {
        const p = document.getElementById('password').value;
        const c = document.getElementById('confirm_password').value;
        const err = document.getElementById('pwd-err');
        if (p !== c) {
            err.style.display = 'block';
            return false;
        }
        err.style.display = 'none';
        return true;
    }

    // Password strength indicator
    document.getElementById('password').addEventListener('input', function () {
        const v = this.value;
        const bar = document.getElementById('strength-bar');
        const lbl = document.getElementById('strength-label');
        let score = 0;
        if (v.length >= 4) score++;
        if (v.length >= 8) score++;
        if (/[A-Z]/.test(v)) score++;
        if (/[0-9]/.test(v)) score++;
        if (/[^A-Za-z0-9]/.test(v)) score++;

        const levels = [
            { w:'20%', bg:'#ef4444', t:'Very Weak' },
            { w:'40%', bg:'#f97316', t:'Weak' },
            { w:'60%', bg:'#eab308', t:'Fair' },
            { w:'80%', bg:'#22c55e', t:'Strong' },
            { w:'100%', bg:'#16a34a', t:'Very Strong' },
        ];
        const lvl = levels[Math.min(score, 4)];
        bar.style.width  = v.length ? lvl.w  : '0%';
        bar.style.background = lvl.bg;
        lbl.textContent  = v.length ? lvl.t : '';
        lbl.style.color  = lvl.bg;
    });

    window.addEventListener('DOMContentLoaded', () => lucide.createIcons());
</script>

{% endblock %}
